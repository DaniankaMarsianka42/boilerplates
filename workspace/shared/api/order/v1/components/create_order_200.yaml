type: object
required:
  - order_uuid
  - total_price

properties:
  order_uuid:
    type: string
    description: Номер заказа
    minLength: 1
    maxLength: 100
    example: "1524f3b2-f3ee-401b-92e8-08de5f46bfe1"

  total_price:
    type: number
    format: float
    description: Общая цена
    example: 1250000.50
