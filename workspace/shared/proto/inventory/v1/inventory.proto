syntax = "proto3";

package inventory.v1;

option go_package = "../../../pkg/proto/inventory/v1;inventory_v1";

import "google/protobuf/timestamp.proto";

service InventoryService{
  rpc GetPart(GetRequest) returns (GetResponse);

  rpc ListenPart(ListenRequest) returns(ListenResponse);
}

message GetRequest{
  string uuid = 1;
}

message GetResponse{
  Part part = 1;
}

message ListenRequest{
  PartsFilter parts = 1;
}

message ListenResponse{
  repeated Part part = 1;
}

message PartsFilter{
  repeated string uuid = 1;
  repeated string name = 2;
  repeated Category category = 3;
  repeated string manufacturer = 4;
  repeated string tags = 5;
}

message Part{
  string uuid = 1;
  string name = 2;
  string description = 3;
  double price = 4;
  int64 stock_quantity = 5;
  Category category = 6;
  Dimensions dimensions = 7;
  Manufacturer manufacturer = 8;
  repeated string tags = 9;
  map<string, Value> metadata = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp update_at = 12;
}
message Value{
  oneof value{
    string string_value = 1;
    int64 int_value = 2;
    double double_value = 3;
    bool bool_value = 4;
  }
}

message Manufacturer{
  string name = 1;
  string country = 2;
  string website = 3;
}

message Dimensions{
  double length = 1;
  double wight = 2;
  double height = 3;
  double weight = 4;
}

enum Category{
  CATEGORY_UNKNOWN = 0;
  ENGINE = 1;
  FUEL = 2;
  PORTHOLE = 3;
  WING = 4;
}